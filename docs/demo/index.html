<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aster: a desktop environment in Lua</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #1e2327;
    color: #d8dee9;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 16px 0;
    box-sizing: border-box;
  }
  canvas {
    border: 1px solid #3b4248;
    outline: none;
    image-rendering: pixelated;
    max-width: 95vw;
    height: auto;
  }
  p { max-width: 700px; text-align: center; margin: 0 8px; }
  a { color: #ff5544; }
  #status { font-size: 12px; color: #8b939b; }
  #reset { color: #8b939b; cursor: pointer; text-decoration: underline; }
  #reset:hover { color: #d8dee9; }
</style>
</head>
<body>
  <canvas id="aster-canvas" width="1024" height="768"></canvas>
  <p>
    <strong>Aster</strong>: a desktop environment in Lua, running as WebAssembly.
    <code>Super+Z</code> opens the editor, <code>Ctrl+S</code> applies your edit live.
    <a href="https://github.com/Xelvra/aster-wm">Source</a>.
  </p>
  <p><span id="status">loading…</span> (<span id="reset" title="Clears saved windows and wm.lua, back to the default.">reset</span>)</p>

  <script src="glue.js"></script>
  <script>
    document.getElementById("reset").addEventListener("click", () => {
      localStorage.clear();
      location.reload();
    });
    (async () => {
      const status = document.getElementById("status");
      const canvas = document.getElementById("aster-canvas");
      try {
        const aster = new Aster(canvas);
        await aster.load("aster-wasm.wasm");
        aster.init(1024, 768);
        window.attachAsterInput(aster, canvas);
        aster.boot();
        aster.run();
        canvas.focus();
        status.textContent = "running";
      } catch (e) {
        status.textContent = "failed to start: " + (e.message || e);
        console.error(e);
      }
    })();
  </script>
</body>
</html>
